version: 2.1
jobs:
  static-source:
    docker:
      - image: node:22-bookworm
    steps:
      - checkout
      - run:
          name: Validate static source
          command: |
            node --check script.js
            test -s index.html
            test -s styles.css
            test -s kova-logo.svg
            test -s README.md
            test -s AGENTS.md
workflows:
  validate:
    jobs:
      - static-source
